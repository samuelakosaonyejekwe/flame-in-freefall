name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # refresh the NASA report snapshot every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write             # keepalive: re-enable this schedule (see below)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh NASA NTRS snapshot
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/fetch-live.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest assets live _site/
          node scripts/build-offline.mjs _site
          node scripts/stamp-sw.mjs _site "${GITHUB_SHA::12}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

      # GitHub pauses scheduled workflows after 60 days without repository
      # activity. Re-enabling through the API resets that clock without
      # creating commits.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
