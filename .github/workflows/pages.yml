name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Hourly, away from the top of the hour: GitHub may delay or drop scheduled
    # runs under load, so frequent runs keep the NASA report snapshot fresh.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write             # keepalive: re-enable this schedule (see below)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check browser fallbacks match the relay
        run: node scripts/check-queries.mjs

      - name: Refresh starter copies of the live sources
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/fetch-live.mjs

      - name: Assemble site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: |
          mkdir -p _site
          cp -r index.html 404.html sw.js manifest.webmanifest assets live _site/
          RELAY_ORIGIN=$(printf '%s' "$RELAY_URL" | sed -E 's#^(https://[^/]+).*#\1#')
          sed -i -e "s#__SITE_URL__#${SITE_URL}#g" -e "s#__RELAY_URL__#${RELAY_URL}#g" -e "s#__RELAY_ORIGIN__#${RELAY_ORIGIN}#g" _site/index.html _site/404.html
          if grep -q "__[A-Z_]*__" _site/index.html _site/404.html; then echo "unreplaced placeholder"; exit 1; fi
          node scripts/build-offline.mjs _site
          node scripts/stamp-sw.mjs _site "${GITHUB_SHA::12}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

      # GitHub pauses scheduled workflows in public repositories after 60 days
      # without repository activity. Calling the enable endpoint is reported to
      # reset that clock, without creating commits. Runs even if a deploy fails.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
